name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint (Biome)
        run: pnpm lint

      - name: Format check (Prettier)
        run: pnpm format:check

      - name: Unit & integration tests
        run: |
          # scheduler 依赖 Redis、queue 依赖 RabbitMQ（compose 提供）
          docker compose -p xianyu up -d --wait redis rabbitmq
          pnpm test

      - name: Build
        run: pnpm build

      - name: Verify no unexpected workspace changes
        run: git diff --exit-code

  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Start compose stack (wait for health)
        run: docker compose up -d --wait

      - name: All three services healthy
        run: |
          docker compose ps --format '{{.Name}} {{.Health}}'
          test "$(docker compose ps --format '{{.Health}}' | grep -c healthy)" -eq 3

      - name: PostgreSQL reachable
        run: docker compose exec -T postgres pg_isready -U xianyu -d xianyu_dev

      - name: Test database created by init.sql
        run: docker compose exec -T postgres psql -U xianyu -d xianyu_dev -tAc "SELECT 1 FROM pg_database WHERE datname='xianyu_test'"

      - name: Tear down
        if: always()
        run: docker compose down -v
